name: Preview on GitHub Pages

# A review copy of the site. This is NOT production — production is ExonHost,
# deployed by deploy.yml. The preview is marked noindex and its robots.txt
# disallows everything, so a public copy cannot compete with the real domain
# in search results.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # A project Pages site is served from /<repo>/, not the domain root.
      - name: Build
        env:
          NEXT_PUBLIC_BASE_PATH: /${{ github.event.repository.name }}
          NEXT_PUBLIC_IS_PREVIEW: "true"
          WP_API_URL: ${{ vars.WP_API_URL }}
        run: npm run build

      # Without this, Pages runs Jekyll, which ignores directories starting
      # with an underscore — every /_next asset would 404.
      - run: touch out/.nojekyll

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
