name: Build and deploy

# Branch model:
#   dev  → builds and deploys to dev.rajshahirentacar.bd (environment `dev`)
#   main → builds only. Production deploys are a deliberate, manual act
#          (workflow_dispatch → production) until cutover is done; after
#          cutover, auto-deploying main is a one-line change.
on:
  push:
    branches: [dev, main]
  workflow_dispatch:
    inputs:
      target:
        description: Where to deploy
        required: true
        default: dev
        type: choice
        options: [dev, production]

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run lint

      # `build` also runs verify:routes, which fails if any of the 27 legacy
      # URLs is missing from the export.
      #
      # Every artifact this workflow produces is a non-production copy (the
      # dev site or an archive) except a production dispatch — those carry
      # noindex meta + disallow-all robots.txt so they can never compete
      # with the live domain. .htaccess adds the header layer on top.
      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_IS_PREVIEW: ${{ github.event_name == 'push' || inputs.target != 'production' }}

      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: out/
          retention-days: 7

  deploy:
    needs: build
    runs-on: ubuntu-latest
    # Nothing to deploy to until the FTP secrets are configured
    # (docs/DEPLOY.md §3). Skip rather than fail every push until then.
    #
    # push → dev deploys; push → main does not deploy (manual dispatch only).
    if: >-
      vars.FTP_CONFIGURED == 'true' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'push' && github.ref == 'refs/heads/dev'))
    environment: ${{ inputs.target || 'dev' }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: site
          path: out

      - name: Upload to ExonHost
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          local-dir: ./out/
          # Environment-scoped: the `dev` environment carries the dev-site
          # document root, `production` the live one. A same-named secret at
          # environment level wins over the repo level.
          server-dir: ${{ secrets.FTP_REMOTE_DIR }}
          # Never touch a WordPress install sharing this account.
          exclude: |
            **/.git*
            **/.git*/**
            **/wp-admin/**
            **/wp-content/**
            **/wp-includes/**
