name: Dashboard CI

# The dispatch dashboard (dashboard/) is built separately from the static
# website: the website workflows ignore dashboard/** paths. This job lints,
# type-checks and builds the app. Database tests run here too once the M1
# migrations exist in dashboard/supabase/migrations.

on:
  push:
    branches: [dashboard-plan, dev, main]
    paths: ["dashboard/**"]
  pull_request:
    paths: ["dashboard/**"]

concurrency:
  group: dashboard-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard/app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: dashboard/app/package-lock.json

      - run: npm ci

      - run: npm run lint

      # Route-aware global types (LayoutProps/PageProps) exist only after
      # typegen, dev or build; typegen is the cheap one.
      - run: npx next typegen

      - run: npx tsc --noEmit

      # The M0 check page is force-dynamic, so no Supabase environment is
      # needed at build time.
      - run: npm run build

  database:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      # Applies every migration, then supabase/seed.sql (local test users).
      - run: supabase start
        working-directory: dashboard

      - run: supabase db reset
        working-directory: dashboard

      - run: supabase db lint --local
        working-directory: dashboard

      - run: docker exec -i supabase_db_dashboard psql -U postgres -d postgres -v ON_ERROR_STOP=1 < dashboard/supabase/tests/rls_test.sql
