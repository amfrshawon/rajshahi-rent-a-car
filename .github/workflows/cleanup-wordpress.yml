name: Remove WordPress leftovers

# One-off cleanup after the static cutover. The production-scoped FTP account
# is rooted at public_html, where the static site now lives.
#
# The first version of this workflow ran `lftp rm -rf wp-content` in a single
# command and hung: FTP has no recursive delete, so lftp walks the whole tree
# one file at a time and gives no output while it does. wp-content/uploads can
# hold thousands of files. This version:
#   1. deletes the loose root files first (seconds),
#   2. empties each big directory with `mirror --reverse --delete` from an
#      empty local folder, which lftp can parallelise,
#   3. caps every step with a timeout and logs what it is doing.
#
# If a directory still cannot be removed over FTP, use cPanel -> File Manager:
# select wp-content and wp-includes and Delete (that runs server-side and is
# instant), then drop the WordPress database in MySQL Databases.

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Type DELETE-WORDPRESS to confirm
        required: true
        type: string

concurrency:
  group: cleanup-wordpress
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 90
    steps:
      - name: Check confirmation
        run: |
          if [ "${{ inputs.confirm }}" != "DELETE-WORDPRESS" ]; then
            echo "Confirmation did not match."
            exit 1
          fi

      - name: Install lftp
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq lftp

      - name: Delete loose WordPress files
        timeout-minutes: 8
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          LFTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_REMOTE_DIR: ${{ secrets.FTP_REMOTE_DIR }}
        run: |
          lftp --env-password -u "$FTP_USERNAME" "$FTP_HOST" -e "
            set ftp:ssl-force true;
            set ftp:ssl-protect-data true;
            set ssl:verify-certificate no;
            set ssl:check-hostname no;
            set net:timeout 20;
            set net:max-retries 2;
            cd '$FTP_REMOTE_DIR';
            rm -f wp-config.php wp-login.php wp-settings.php wp-load.php wp-blog-header.php;
            rm -f wp-cron.php wp-comments-post.php wp-links-opml.php wp-mail.php wp-signup.php;
            rm -f wp-trackback.php xmlrpc.php index.php readme.html license.txt .user.ini;
            ls;
            bye
          "

      - name: Empty and remove wp-content
        # wp-content/uploads can hold thousands of files and FTP deletes them
        # one at a time; a 15-minute cap cut it off mid-way. This step resumes
        # where the last run stopped because deletes are idempotent.
        timeout-minutes: 60
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          LFTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_REMOTE_DIR: ${{ secrets.FTP_REMOTE_DIR }}
        run: |
          mkdir -p /tmp/empty
          lftp --env-password -u "$FTP_USERNAME" "$FTP_HOST" -e "
            set ftp:ssl-force true;
            set ftp:ssl-protect-data true;
            set ssl:verify-certificate no;
            set ssl:check-hostname no;
            set net:timeout 20;
            set net:max-retries 2;
            set mirror:parallel-transfer-count 16;
            set mirror:use-pget-n 1;
            cd '$FTP_REMOTE_DIR';
            mirror --reverse --delete --verbose /tmp/empty wp-content;
            rmdir wp-content;
            bye
          "

      - name: Empty and remove wp-includes
        timeout-minutes: 20
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          LFTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_REMOTE_DIR: ${{ secrets.FTP_REMOTE_DIR }}
        run: |
          mkdir -p /tmp/empty
          lftp --env-password -u "$FTP_USERNAME" "$FTP_HOST" -e "
            set ftp:ssl-force true;
            set ftp:ssl-protect-data true;
            set ssl:verify-certificate no;
            set ssl:check-hostname no;
            set net:timeout 20;
            set net:max-retries 2;
            set mirror:parallel-transfer-count 16;
            cd '$FTP_REMOTE_DIR';
            mirror --reverse --delete --verbose /tmp/empty wp-includes;
            rmdir wp-includes;
            bye
          "

      - name: Report what is left
        if: always()
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          LFTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_REMOTE_DIR: ${{ secrets.FTP_REMOTE_DIR }}
        run: |
          lftp --env-password -u "$FTP_USERNAME" "$FTP_HOST" -e "
            set ftp:ssl-force true;
            set ftp:ssl-protect-data true;
            set ssl:verify-certificate no;
            set ssl:check-hostname no;
            cd '$FTP_REMOTE_DIR';
            cls -1 | grep -i '^wp-' || echo 'no wp-* entries left';
            bye
          "
